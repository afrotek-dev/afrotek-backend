name: CI
on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, product-service]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --prefix services/${{ matrix.service }}
      - name: Lint
        run: npm run lint --prefix services/${{ matrix.service }}
      - name: Test
        run: npm run test --prefix services/${{ matrix.service }}
